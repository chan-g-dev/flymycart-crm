<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- Yellow Background Pill / Box -->
  <rect width="520" height="120" rx="12" fill="#FFE500"/>
  
  <g transform="translate(20, 15)">
    <!-- STYLIZED 'F' WITH AIRPLANE -->
    <g transform="translate(0, 5)">
      <!-- Top Wing/Roof of F (Black) -->
      <path d="M 18 10 C 26 2 46 2 54 10 L 44 26 C 38 22 28 22 22 26 Z" fill="#1C1C1C" />
      
      <!-- F Stem (Vibrant Blue) -->
      <path d="M 8 50 L 22 18 C 24 14 28 10 34 10 L 22 42 L 38 42 L 34 54 L 18 54 L 10 82 L 0 82 Z" fill="#0A5FC2" />
      
      <!-- Cyan Swoosh under plane -->
      <path d="M 4 50 C 14 42 28 42 38 48 C 30 52 18 52 8 58 Z" fill="#00A3E0" />
      
      <!-- White Soaring Jet / Airplane -->
      <path d="M 28 26 L 36 24 C 44 22 52 24 50 30 C 48 34 40 34 32 32 Z" fill="#FFFFFF" />
      <path d="M 32 20 L 44 28 L 26 34 Z" fill="#FFFFFF" />
      <circle cx="48" cy="28" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- 'LY MY' TEXT (Italic Bold Blue) -->
    <text x="64" y="68" font-family="'Arial Black', 'Impact', sans-serif" font-size="58" font-weight="900" font-style="italic" fill="#0A5FC2" letter-spacing="-1">
      LY MY
    </text>

    <!-- 'CART' (C as shopping cart) -->
    <!-- Shopping Cart 'C' -->
    <g transform="translate(306, 12)">
      <!-- Cart Top Handle -->
      <path d="M 22 14 C 22 2 38 2 38 14" fill="none" stroke="#0A5FC2" stroke-width="7" stroke-linecap="round" />
      
      <!-- C Body (Cart Basket) -->
      <path d="M 44 14 C 44 14 16 12 10 32 C 6 48 10 64 26 66 L 46 66 L 42 54 L 26 54 C 20 54 18 46 20 38 C 22 28 30 26 40 26 Z" fill="#0A5FC2" />
      
      <!-- Cart Wheels -->
      <circle cx="16" cy="74" r="6.5" fill="#1C1C1C" />
      <circle cx="36" cy="74" r="6.5" fill="#1C1C1C" />
    </g>

    <!-- 'ART' Text -->
    <text x="360" y="68" font-family="'Arial Black', 'Impact', sans-serif" font-size="58" font-weight="900" font-style="italic" fill="#0A5FC2" letter-spacing="-1">
      ART
    </text>

    <!-- Slogan 'Shop and Ship...!' in handwritten italic -->
    <text x="348" y="94" font-family="'Brush Script MT', 'Segoe Script', 'Caveat', cursive, sans-serif" font-size="21" font-weight="bold" font-style="italic" fill="#5A3E1B" letter-spacing="0.5">
      Shop and Ship...!
    </text>
  </g>
</svg>
